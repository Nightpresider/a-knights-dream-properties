<div class="migration-dialog">
  <h2>A Knights Dream Properties — Material Migration</h2>
  <p>This will scan world items (weapons/equipment) and set material category and craft flags when it finds a matching material name in the item name.</p>
  <p><strong>Note:</strong> This operation updates items in-place. It is recommended to back up your world before running.</p>
  <div class="form-group">
    <button type="button" id="run-migration" class="btn">Run Migration Now</button>
    <button type="button" id="close-dialog" class="btn">Close</button>
  </div>
</div>
